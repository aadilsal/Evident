name: Bug report
description: Something crashes or behaves wrongly (not a map accuracy problem)
title: 'bug: '
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [CLI, Claude skill, Web app, API, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or URL, plus `evident --version` output.
      render: shell
    validations:
      required: true
