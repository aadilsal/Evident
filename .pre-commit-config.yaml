# Run before every commit: pre-commit run --all-files
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
# Gallery graphs are minified on purpose (size limit); web/ formats its own TS with Prettier.
exclude: ^(engine/tests/fixtures/|benchmark/\.repos/|web/public/data/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # frozen: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^engine/
      - id: ruff-format
        files: ^engine/

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 1463d990e0801964764a375260dca598513f3be5 # frozen: v3.3.3
    hooks:
      - id: prettier
        types_or: [json, yaml]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d # frozen: 0.39.0
    hooks:
      - id: check-metaschema
        files: ^schema/.*\.schema\.json$
      - id: check-jsonschema
        name: validate schema examples
        files: ^schema/examples/.*\.graph\.json$
        args: [--schemafile, schema/graph.schema.json]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, test, docs, build, ci, chore]
