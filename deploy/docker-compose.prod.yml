# Production overrides for one small server (2 GiB RAM), layered on docker-compose.yml:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Adds Caddy for HTTPS and sizes the worker for the box. See docs/runbook/deployment.md.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: [../.env]
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [egress]

  api:
    environment:
      EVIDENT_TRUST_PROXY: '1'

  worker:
    # One analysis at a time; clones live in a RAM disk, so keep both inside 2 GiB.
    tmpfs: ['/tmp:size=512m']
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 768m, pids: 256 }

  postgres:
    command: ['postgres', '-c', 'shared_buffers=128MB', '-c', 'max_connections=40']

volumes:
  caddy_data:
  caddy_config:
