[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evident-map"
version = "0.2.0"
description = "Evidence-backed architecture maps: routes, models and services, each linked to the line that proves it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Aadil Salman Butt" }]
keywords = ["architecture", "static-analysis", "nextjs", "express", "prisma", "tree-sitter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tree-sitter>=0.24",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.scripts]
evident = "evident.cli:run"
evident-bench = "evident.bench:run"

[project.urls]
Homepage = "https://github.com/aadilsal/Evident"

[project.optional-dependencies]
service = [
    "arq>=0.26",
    "fastapi>=0.115",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "jsonschema>=4.23",
  "pre-commit>=4.0",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evident"]
# The map UI (web/ static export) is git-ignored but ships in wheels: `npm run build:bundle`.
artifacts = ["src/evident/webui/**"]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
# git is invoked with a fixed argv list, never through a shell
"src/evident/repo.py" = ["S603", "S607"]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "referencing", "referencing.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
